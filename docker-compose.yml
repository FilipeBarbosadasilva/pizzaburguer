
services:
  mysql:
    image: mysql:8.0
    container_name: pizzaburguer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pizzaburguer_db
      MYSQL_ROOT_PASSWORD: pizzaburguer_dev
    ports:
      - "3307:3306"
    volumes:
      - pizzaburguer-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p'$$MYSQL_ROOT_PASSWORD' --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizzaburguer-backend
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pizzaburguer_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pizzaburguer_dev
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: pizzaburguer-frontend
    restart: unless-stopped
    ports:
      - "80:81"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: pizzaburguer-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pizzaburguer-db:

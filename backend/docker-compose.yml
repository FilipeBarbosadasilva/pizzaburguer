services:
  mysql:
    image: mysql:8.0
    container_name: pizzaburguer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pizzaburguer_db
      MYSQL_ROOT_PASSWORD: pizzaburguer_dev
    ports:
      - "3307:3306"
    volumes:
      - pizzaburguer-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$pizzaburguer_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizzaburguer-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pizzaburguer_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pizzaburguer_dev
      SERVER_PORT: 8081
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: nginx:alpine
    container_name: pizzaburguer-frontend
    restart: unless-stopped
    ports:
      - "80:81"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: pizzaburguer-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pizzaburguer-db:

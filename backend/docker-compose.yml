version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: pizzaburguer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pizzaburguer
      MYSQL_USER: pizzaburguer
      MYSQL_PASSWORD: pizzaburguer
      MYSQL_ROOT_PASSWORD: 
    ports:
      - "3307:3307"
    volumes:
      - pizzaburguer-db:/var/lib/mysql

volumes:
  pizzaburguer-db:

services:
  mysql:
    image: mysql:8.0
    container_name: pizzaburguer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pizzaburguer_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - pizzaburguer-db:/var/lib/mysql

volumes:
  pizzaburguer-db:
server.port=8080
spring.application.name=pizzaburguer-backend
server.servlet.session.cookie.same-site=strict

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/pizzaburguer_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=never

# Defaults target a local Mailpit instance; override these for another SMTP provider.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:no-reply@pizzaburguer.local}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c73523">
  <title>Carregando | Pizzaburguer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <style>
    :root {
      --tomato: #c73523;
      --tomato-dark: #9e281b;
      --mustard: #f3c449;
      --ink: #252723;
      --paper: #fffefa;
      --shadow: rgba(30, 22, 19, 0.16);
      --font-body: "DM Sans", sans-serif;
      --font-display: "Fraunces", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: linear-gradient(135deg, #fff9f5 0%, #fdf3ef 35%, #fffefa 100%);
      font-family: var(--font-body);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .loader-screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(199, 53, 35, 0.12), transparent 36%),
        linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.15));
      isolation: isolate;
    }

    .loader-screen::before,
    .loader-screen::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.5;
      z-index: -1;
    }

    .loader-screen::before {
      width: 440px;
      height: 440px;
      background: rgba(243, 196, 73, 0.18);
      top: 12%;
      left: 12%;
    }

    .loader-screen::after {
      width: 500px;
      height: 500px;
      background: rgba(199, 53, 35, 0.12);
      bottom: 7%;
      right: 10%;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: min(92vw, 420px);
      padding: clamp(24px, 4vw, 56px);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(37, 39, 35, 0.06);
      box-shadow: 0 30px 70px var(--shadow);
      backdrop-filter: blur(8px);
      text-align: center;
      animation: floatIn 0.5s ease both;
    }

    .brand-badge {
      width: 90px;
      height: 90px;
      display: grid;
      place-items: center;
      border-radius: 50% 50% 48% 50%;
      background: linear-gradient(135deg, var(--tomato), #db574d);
      color: white;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.2rem, 4vw, 3.1rem);
      transform: rotate(-10deg);
      box-shadow: 0 20px 35px rgba(199, 53, 35, 0.28);
      position: relative;
    }

    .brand-badge::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .loader-ring {
      position: relative;
      width: 110px;
      height: 110px;
      display: grid;
      place-items: center;
      margin-top: 4px;
    }

    .loader-ring::before,
    .loader-ring::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .loader-ring::before {
      border: 4px solid rgba(199, 53, 35, 0.14);
    }

    .loader-ring::after {
      border: 4px solid transparent;
      border-top-color: var(--tomato);
      border-right-color: var(--mustard);
      animation: spin 0.6s linear infinite;
    }

    .loader-core {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mustard), #f7db8a);
      box-shadow: 0 0 18px rgba(243, 196, 73, 0.7);
    }

    .loader-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--ink);
    }

    .loader-subtitle {
      margin: 0;
      color: rgba(37, 39, 35, 0.74);
      font-size: clamp(0.95rem, 2.3vw, 1.08rem);
      letter-spacing: 0.02em;
    }

    .progress-bar {
      width: min(260px, 70vw);
      height: 8px;
      border-radius: 999px;
      background: rgba(37, 39, 35, 0.08);
      overflow: hidden;
      position: relative;
      margin-top: 8px;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--tomato), var(--mustard));
      transform-origin: left center;
      animation: progress 0.4s ease-in-out both;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes progress {
      from { transform: scaleX(0.15); }
      to { transform: scaleX(1); }
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      .loader-card {
        border-radius: 22px;
        gap: 12px;
      }

      .brand-badge {
        width: 72px;
        height: 72px;
      }

      .loader-ring {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>
<body>
  <main class="loader-screen" aria-live="polite" aria-label="Carregando a aplicação">
    <section class="loader-card">
      <div class="brand-badge" aria-hidden="true">P</div>
      <div class="loader-ring" aria-hidden="true">
        <span class="loader-core"></span>
      </div>
      <h1 class="loader-title">Pizzaburguer</h1>
      <p class="loader-subtitle">Preparando sua experiência...</p>
      <div class="progress-bar" aria-hidden="true">
        <span class="progress-fill"></span>
      </div>
    </section>
  </main>

  <script>
    const targetPage = 'index.html';
    const delayMs = 400;

    window.addEventListener('load', () => {
      setTimeout(() => {
        window.location.href = targetPage;
      }, delayMs);
    });
  </script>
</body>
</html>
